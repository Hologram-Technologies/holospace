spec = "lexlean/project/1"
name = "prism-holospace-kernel"
language = "1.2"
module_prefix = "PrismHolospace"
source_roots = ["src"]
entrypoints = ["src/Holospace.lex.tex", "src/HolospaceAdmission.lex.tex", "src/HolospaceAdmissionProofs.lex.tex", "src/HolospaceCapabilityGate.lex.tex", "src/HolospaceCapabilityGateProofs.lex.tex", "src/HolospaceIdentity.lex.tex", "src/HolospaceIsolation.lex.tex", "src/HolospaceIsolationProofs.lex.tex", "src/HolospaceLaunchVerdict.lex.tex", "src/HolospaceLaunchVerdictProofs.lex.tex", "src/HolospaceLifecycle.lex.tex", "src/HolospaceLifecycleProofs.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000
